name: Set up Rust
description: >-
  Install the Rust toolchain pinned in rust-toolchain.toml as the only
  toolchain, and restore the Cargo dependency cache for the calling job.

runs:
  using: composite
  steps:
    # GitHub's image ships these; apt (Ubuntu's servers) runs only for one it
    # lacks. cmake and pkg-config build native dependencies; systemd-analyze
    # verifies the unit files the CLI tests write.
    - name: Install build tools missing from the runner image
      if: runner.os == 'Linux'
      shell: bash
      run: |
        missing=()
        command -v cmake >/dev/null || missing+=(cmake)
        command -v pkg-config >/dev/null || missing+=(pkg-config)
        command -v systemd-analyze >/dev/null || missing+=(systemd)
        if [ "${#missing[@]}" -gt 0 ]; then
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y "${missing[@]}"
        fi

    # rust-cache hashes every installed toolchain into its cache key. The
    # runner image carries its own stable Rust, which GitHub updates on its
    # own schedule, so leaving it installed starts a cold cache with every
    # image update although the pinned toolchain has not changed.
    - name: Install the pinned Rust toolchain
      shell: bash
      run: |
        rustup toolchain install
        pinned="$(rustup show active-toolchain | cut -d' ' -f1)"
        rustup default "$pinned"
        rustup toolchain list | cut -d' ' -f1 | while read -r toolchain; do
          [ "$toolchain" = "$pinned" ] || rustup toolchain uninstall "$toolchain"
        done
        rustc --version

    # Dependencies only: workspace crates are rebuilt on every run. Caches are
    # saved from main alone, where every other ref can restore them; a cache
    # saved from a pull request or a tag is visible to that ref only and
    # counts against the repository's 10 GB.
    - name: Restore the Cargo cache
      uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
