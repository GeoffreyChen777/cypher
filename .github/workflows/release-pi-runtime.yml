# Builds and publishes the Pi Runtime release.
#
# Pushing a `pi-runtime-v<version>` tag publishes the Runtime channel ALONE:
# devices poll `runtimes/pi/manifest.json` on their own, so a curated-package
# refresh reaches them without an application release. The application manifest
# and `latest.txt` are never written here, and the job needs no `contents:
# write` because a Runtime release has no GitHub assets. Like every other
# release workflow, workflow_dispatch is ALWAYS build/validate-only. The tag
# must match `pi-runtime/release.json`.
name: Release (Pi Runtime)

on:
  push:
    tags: ["pi-runtime-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.context.outputs.version }}
      publish: ${{ steps.context.outputs.publish }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate the tag and require the publication credential
        id: context
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/ci/release.py runtime-context

  build:
    name: Build (${{ matrix.runner }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: pi-runtime/package-lock.json

      - name: Package the Runtime with real RPC and negative extension tests
        run: scripts/package-pi-runtime.sh

      - name: Test that the Runtime metadata size is portable
        run: python3 scripts/tests/test-linux-cli.py Installer.test_runtime_metadata_size_is_portable_and_validated

      - name: Smoke-test the full Runtime on the minimum Linux glibc
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$PWD/target/package:/packages:ro" \
            -v "$PWD/scripts/ci:/ci:ro" \
            -v "$PWD/pi-runtime/provider-service.test.mjs:/provider-service.test.mjs:ro" \
            ubuntu:20.04 sh -ec '
              mkdir /runtime /agent
              archive=$(find /packages -name "cypher-pi-runtime-*.tar.gz")
              tar -xzf "$archive" -C /runtime --strip-components=1
              cp /provider-service.test.mjs /runtime/provider-service.test.mjs
              /runtime/bin/node /ci/pi-runtime-smoke.mjs /runtime
              PI_CODING_AGENT_DIR=/agent PI_PACKAGE_DIR=/runtime/pi \
                CYPHER_PROVIDER_HELPER=/runtime/provider-service.mjs \
                /runtime/bin/node --test /runtime/provider-service.test.mjs
            '

      - name: Upload the package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pi-runtime-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/package/cypher-pi-runtime-*.tar.gz
            target/package/cypher-pi-runtime-*.json
          if-no-files-found: error

  validate-artifacts:
    name: Validate artifacts
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download the packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: target/release-dist
          merge-multiple: true

      - name: Validate every artifact before any production write
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: python3 scripts/ci/release.py validate-runtime --dist target/release-dist --version "$VERSION"

      - name: Upload the manifest
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pi-runtime-manifest
          path: target/release-plan/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [preflight, validate-artifacts]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pi-runtime-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: cypher-production
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download the packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: target/release-dist
          merge-multiple: true

      - name: Validate, reject conflicts and rollbacks, upload immutable objects, move one pointer
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1489e726fc5baa8ecc7a6e1a8c8ed3f8
          CYPHER_PRODUCTION_LOCK: held
        run: python3 scripts/ci/release.py publish-runtime --dist target/release-dist --version "$VERSION"
