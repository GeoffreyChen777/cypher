name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Shares the lock with release's publish job: readiness checks cannot race
# channel promotion. Always deploy a single fresh main snapshot, not a delta
# against github.event.before (pending/cancelled pushes can omit that delta).
concurrency:
  group: cypher-production
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: require main and deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || {
            echo "::error::Production deployment is main-only"; exit 1;
          }
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::NOT DEPLOYED: configure CLOUDFLARE_API_TOKEN in repository Actions secrets."; exit 1;
          }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - id: source
        name: record the snapshot all workers will deploy
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - run: npm ci --prefix edge
      - run: npm --prefix edge run typecheck
      - run: npm --prefix edge test
      - run: node --test scripts/test-landing.mjs
      - name: installer compatibility gate (read-only)
        run: python3 scripts/ci/release.py check-deploy
      - name: deployment summary
        run: echo "Deploying main snapshot $(git rev-parse HEAD); installer prerequisites verified." >> "$GITHUB_STEP_SUMMARY"

  workers:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        config:
          - edge/wrangler.jsonc
          - apps/landing/wrangler.jsonc
          - apps/www-redirect/wrangler.jsonc
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - run: npm ci --prefix edge
      - name: deploy with lockfile-pinned Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONFIG: ${{ matrix.config }}
        run: node edge/node_modules/wrangler/bin/wrangler.js deploy --config "$CONFIG"
