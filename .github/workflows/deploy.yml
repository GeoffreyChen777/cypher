# Deploys the Edge, landing and www-redirect Workers on pushes to main and
# main-only manual runs.
#
# One fresh main snapshot is tested and then deployed to all three Workers,
# never a delta against github.event.before: pending or cancelled pushes can
# omit that delta.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Shares the lock with the release workflows' publish jobs: readiness checks
# cannot race channel promotion.
concurrency:
  group: cypher-production
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: Verify the snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Require main and the deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || {
            echo "::error::Production deployment is main-only"; exit 1;
          }
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::NOT DEPLOYED: configure CLOUDFLARE_API_TOKEN in repository Actions secrets."; exit 1;
          }

      - name: Check out main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - name: Record the snapshot every Worker deploys
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/edge/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix apps/edge

      - name: Typecheck the Edge
        run: npm --prefix apps/edge run typecheck

      - name: Test the Edge
        run: npm --prefix apps/edge test

      - name: Test the landing page
        run: node --test scripts/tests/test-landing.mjs

      - name: Check installer compatibility (read-only)
        run: python3 scripts/ci/release.py check-deploy

      - name: Summarize the deployment
        run: echo "Deploying main snapshot $(git rev-parse HEAD); installer prerequisites verified." >> "$GITHUB_STEP_SUMMARY"

  workers:
    name: Deploy (${{ matrix.config }})
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        config:
          - apps/edge/wrangler.jsonc
          - apps/landing/wrangler.jsonc
          - apps/www-redirect/wrangler.jsonc
    steps:
      - name: Check out the verified snapshot
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/edge/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix apps/edge

      - name: Deploy with the lockfile-pinned Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONFIG: ${{ matrix.config }}
        run: node apps/edge/node_modules/wrangler/bin/wrangler.js deploy --config "$CONFIG"
