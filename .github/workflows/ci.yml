# Checks every change on pull requests, pushes to main and manual runs.
#
# Each step runs one stage of scripts/check.sh, the entry point used locally
# (docs/development/README.md#checks). The Rust checks are split into jobs
# that build different feature sets, so they run side by side instead of
# rebuilding the workspace one after another. The heavy Rust jobs and the iOS
# job run only when the change touches something they build or read
# (scripts/ci/changed_areas.py). No deployment credentials are available to
# these jobs.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a pull request's run. Runs on main always finish,
# so every commit there has a verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No debug info for workspace crates: it costs about a tenth of the build,
  # and a failing test still reports its file and line.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      ios: ${{ steps.areas.outputs.ios }}
    steps:
      # Two commits deep: a pull request's merge commit with its base, or a
      # pushed commit with the one before it.
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Decide which jobs the change needs
        id: areas
        env:
          BEFORE: ${{ github.event.before }}
        run: python3 scripts/ci/changed_areas.py

  scripts:
    name: Scripts and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version

      - name: Lint the workflows
        run: bash scripts/check.sh workflows

      - name: Test the scripts and release tooling
        run: bash scripts/check.sh scripts

      - name: Test the installer on Python 3.8
        run: bash scripts/ci/installer-py38.sh

      - name: Test the Pi runtime
        run: bash scripts/check.sh runtime

  edge:
    name: Edge
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/edge/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix apps/edge

      - name: Typecheck and test
        run: bash scripts/check.sh edge

  # Always runs: besides clippy, the lint stage checks every script in the
  # repository, whatever part of it changed.
  lint-linux:
    name: Lint (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Check formatting
        run: bash scripts/check.sh fmt

      - name: Lint the scripts and the headless crates
        run: bash scripts/check.sh lint

  test-linux:
    name: Test (Linux)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Test the headless crates
        run: bash scripts/check.sh rust-test

  build-linux:
    name: Build (Linux)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Build the headless binary and test the development profile
        run: bash scripts/check.sh rust-build

  # Both macOS jobs run on the macOS and SDK major of the release build in
  # release-macos.yml.
  lint-macos:
    name: Lint (macOS)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Lint the workspace
        run: bash scripts/check.sh macos-lint

  test-macos:
    name: Test (macOS)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Test the desktop app
        run: bash scripts/check.sh macos-test

  test-ios:
    name: Test (iOS)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # The runner of the archive job in release-ios.yml; the ios stage selects
    # the Xcode pinned in .xcode-version.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Lint and test the iOS app
        run: bash scripts/check.sh ios
