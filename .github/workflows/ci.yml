name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Each step runs one stage of scripts/check.sh, the same entry point used
  # locally; see docs/development/README.md.
  workflow-and-release-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
      - run: bash scripts/check.sh workflows
      - run: bash scripts/check.sh scripts
      - name: installer regressions on release container Python 3.8
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo public.ecr.aws/docker/library/ubuntu:20.04 bash -ec '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq python3 curl ca-certificates
            python3 scripts/tests/test-linux-cli.py
          '
      - run: bash scripts/check.sh runtime

  edge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/edge/package-lock.json
      - run: npm ci --prefix apps/edge
      - run: bash scripts/check.sh edge

  linux-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
      - run: sudo apt-get update -qq && sudo apt-get install -y cmake pkg-config systemd
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: bash scripts/check.sh fmt
      - run: bash scripts/check.sh lint
      - run: bash scripts/check.sh rust

  macos-workspace:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: bash scripts/check.sh macos
