name: release

# Tag pushes publish; workflow_dispatch is ALWAYS build/validate-only, even
# when a tag is selected. Production writes hold the lock shared with deploy.
on:
  push:
    tags: ["cypher-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.context.outputs.version }}
      publish: ${{ steps.context.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: validate tag/version and fail early on missing publication credential
        id: context
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/ci/release.py context

  linux:
    needs: preflight
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # Do not build on the host's newer libc. No host Rust cache is imported.
    container:
      image: ubuntu:20.04
    defaults:
      run:
        shell: bash
    steps:
      - name: bootstrap glibc 2.31 build environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl git build-essential pkg-config cmake binutils python3 systemd
      - name: bootstrap rustup (toolchain version comes from rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: bash scripts/test-check-linux-abi.sh
      - name: package headless application
        run: scripts/package-linux.sh
      - name: isolated CLI and installer regressions
        run: |
          cargo test --locked --no-default-features -p cypher -p cypher-update --bins --lib
          python3 scripts/test-linux-cli.py --binary target/release/cypher
      - name: smoke extracted artifact and recheck ABI
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          archive="target/package/cypher-$VERSION-linux-$(uname -m).tar.gz"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          tar -xzf "$archive" -C "$stage" --strip-components=1
          scripts/check-linux-abi.sh "$stage/cypher"
          set +e
          CYPHER_DATA_DIR="$stage/data" timeout 8 "$stage/cypher" headless
          rc=$?
          set -e
          test "$rc" = 124 || { echo "headless smoke exited with $rc"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ runner.arch }}
          path: target/package/*.tar.gz
          if-no-files-found: error

  macos:
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 40
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
      AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
      AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: test "$(uname -m)" = arm64
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: import optional Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          pass="$(openssl rand -hex 16)"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 -d >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          test -n "$identity"
          echo "CODESIGN_IDENTITY=$identity" >>"$GITHUB_ENV"
      - name: optional notary credentials
        if: env.AC_API_KEY_P8 != ''
        run: |
          printf '%s' "$AC_API_KEY_P8" >"$RUNNER_TEMP/ac_api_key.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/ac_api_key.p8"
            echo "NOTARY_KEY_ID=$AC_API_KEY_ID"
            echo "NOTARY_ISSUER_ID=$AC_API_ISSUER_ID"
          } >>"$GITHUB_ENV"
      - run: scripts/package-macos.sh
      - name: verify macOS package and executable
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          codesign --verify --strict target/package/Cypher.app
          test "$(target/package/Cypher.app/Contents/MacOS/cypher --version)" = "cypher $VERSION"
          hdiutil verify "target/package/cypher-$VERSION-macos-arm64.dmg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ runner.arch }}
          path: |
            target/package/*.dmg
            target/package/*.tar.gz
          if-no-files-found: error

  pi-runtime:
    needs: preflight
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: dist/pi-runtime/package-lock.json
      - name: package Runtime with real RPC and negative extension tests
        run: scripts/package-pi-runtime.sh
      - run: python3 scripts/test-linux-cli.py Installer.test_runtime_metadata_size_is_portable_and_validated
      - name: full Runtime smoke on minimum Linux glibc
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$PWD/target/package:/packages:ro" \
            -v "$PWD/scripts/ci:/ci:ro" \
            -v "$PWD/dist/pi-runtime/provider-service.test.mjs:/provider-service.test.mjs:ro" \
            ubuntu:20.04 sh -ec '
              mkdir /runtime /agent
              archive=$(find /packages -name "cypher-pi-runtime-*.tar.gz")
              tar -xzf "$archive" -C /runtime --strip-components=1
              cp /provider-service.test.mjs /runtime/provider-service.test.mjs
              /runtime/bin/node /ci/pi-runtime-smoke.mjs /runtime
              PI_CODING_AGENT_DIR=/agent PI_PACKAGE_DIR=/runtime/pi \
                CYPHER_PROVIDER_HELPER=/runtime/provider-service.mjs \
                /runtime/bin/node --test /runtime/provider-service.test.mjs
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pi-runtime-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/package/cypher-pi-runtime-*.tar.gz
            target/package/cypher-pi-runtime-*.json
          if-no-files-found: error

  validate-artifacts:
    needs: [preflight, linux, macos, pi-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: target/release-dist
          merge-multiple: true
      - name: validate every artifact before any production write
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: python3 scripts/ci/release.py validate --dist target/release-dist --version "$VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: checksums-and-manifests
          path: target/release-plan/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cypher-v')
    needs: [preflight, validate-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: cypher-production
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: target/release-dist
          merge-multiple: true
      - name: validate, reject conflicts/rollback, upload immutable objects, promote last
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1489e726fc5baa8ecc7a6e1a8c8ed3f8
          GITHUB_TOKEN: ${{ github.token }}
          CYPHER_PRODUCTION_LOCK: held
        run: python3 scripts/ci/release.py publish --dist target/release-dist --version "$VERSION"
