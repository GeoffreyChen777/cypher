# Builds and publishes the Linux release.
#
# Pushing a `cypher-linux-v<version>-b<build>` tag publishes the LINUX channel
# alone: `linux/manifest.json` and `linux/latest.txt`. macOS, iOS and the
# Runtime are untouched, and their channels are read-only here. The version
# must match `[workspace.package].version`; the build is the per-platform
# counter, so the same version can be re-cut for Linux without disturbing
# macOS. Like every other release workflow, workflow_dispatch is ALWAYS
# build/validate-only.
name: Release (Linux)

on:
  push:
    tags: ["cypher-linux-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.context.outputs.version }}
      build: ${{ steps.context.outputs.build }}
      publish: ${{ steps.context.outputs.publish }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate the tag and require the publication credential
        id: context
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/ci/release.py platform-context --platform linux

  build:
    name: Build (${{ matrix.runner }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    # Do not build on the host's newer libc. No host Rust cache is imported.
    # Docker Hub's sign-in for GitHub's runners failed for hours on
    # 2026-10-09, so the mirror at public.ecr.aws/docker/library/ubuntu:20.04
    # (same image) stood in; Docker Hub works again.
    container:
      image: ubuntu:20.04
    defaults:
      run:
        shell: bash
    steps:
      # scripts/ci/apt-install.sh, inlined: no git, so no checkout, yet.
      # Ubuntu's servers with retries, then signature-checked fallback
      # mirrors (GitHub's runners could not resolve archive.ubuntu.com for
      # hours on 2026-11-11). Change both together.
      - name: Install the glibc 2.31 build environment
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\n' >/etc/apt/apt.conf.d/80-ci-retries
          packages=(ca-certificates curl git build-essential pkg-config cmake binutils python3 systemd)
          # A hard limit per attempt: apt's timeout misses a trickling server
          # (an amd64 build sat here 40 minutes on 2026-11-23).
          install() { timeout 300 apt-get update -qq && timeout 600 apt-get install -y -qq "${packages[@]}"; }
          install && exit 0
          case "$(dpkg --print-architecture)" in
            amd64) mirrors=(http://mirrors.edge.kernel.org/ubuntu http://mirror.us.leaseweb.net/ubuntu http://mirrors.mit.edu/ubuntu) ;;
            arm64) mirrors=(http://ftp.tu-chemnitz.de/pub/linux/ubuntu-ports http://mirrors.ustc.edu.cn/ubuntu-ports) ;;
            *) mirrors=() ;;
          esac
          cp /etc/apt/sources.list /etc/apt/sources.list.ubuntu
          for mirror in "${mirrors[@]}"; do
            echo "Ubuntu's servers failed; trying $mirror" >&2
            sed -E "s#http://(archive|security|ports)\.ubuntu\.com/ubuntu(-ports)?/?#$mirror/#" \
              /etc/apt/sources.list.ubuntu >/etc/apt/sources.list
            install && exit 0
          done
          exit 1

      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Test the ABI check
        run: bash scripts/tests/test-check-linux-abi.sh

      - name: Package the headless application
        env:
          CYPHER_RELEASE_BUILD: ${{ needs.preflight.outputs.build }}
        run: scripts/package-linux.sh

      - name: Test the CLI and the installer in isolation
        run: |
          cargo test --locked --no-default-features -p cypher -p cypher-update --bins --lib
          python3 scripts/tests/test-linux-cli.py --binary target/release/cypher

      - name: Smoke-test the extracted artifact and recheck its ABI
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          BUILD: ${{ needs.preflight.outputs.build }}
        run: |
          set -euo pipefail
          stem="$VERSION"
          test "$BUILD" = 1 || stem="$VERSION-b$BUILD"
          archive="target/package/cypher-$stem-linux-$(uname -m).tar.gz"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          tar -xzf "$archive" -C "$stage" --strip-components=1
          scripts/check-linux-abi.sh "$stage/cypher"
          set +e
          CYPHER_DATA_DIR="$stage/data" timeout 8 "$stage/cypher" headless
          rc=$?
          set -e
          test "$rc" = 124 || { echo "headless smoke exited with $rc"; exit 1; }

      - name: Upload the package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-${{ runner.arch }}
          path: target/package/*.tar.gz
          if-no-files-found: error

  validate-artifacts:
    name: Validate artifacts
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download the packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: target/release-dist
          merge-multiple: true

      - name: Validate every artifact before any production write
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          BUILD: ${{ needs.preflight.outputs.build }}
        run: |
          python3 scripts/ci/release.py validate-platform --platform linux \
            --dist target/release-dist --version "$VERSION" --build "$BUILD"

      - name: Upload the checksums and manifests
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: checksums-and-manifests
          path: target/release-plan/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [preflight, validate-artifacts]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cypher-linux-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: cypher-production
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download the packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: target/release-dist
          merge-multiple: true

      - name: Validate, reject conflicts and rollbacks, upload immutable objects, promote last
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          BUILD: ${{ needs.preflight.outputs.build }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1489e726fc5baa8ecc7a6e1a8c8ed3f8
          GITHUB_TOKEN: ${{ github.token }}
          CYPHER_PRODUCTION_LOCK: held
        run: |
          python3 scripts/ci/release.py publish-platform --platform linux \
            --dist target/release-dist --version "$VERSION" --build "$BUILD"
