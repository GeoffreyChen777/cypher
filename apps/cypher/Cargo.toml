[package]
name = "cypher"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cypher"
path = "src/main.rs"

[features]
# Desktop UI (gpui) is optional so the Linux artifact can ship genuinely
# headless: `cargo build --no-default-features` links no X11/Wayland/GPUI and
# targets glibc 2.31 (Ubuntu 20.04 or newer). macOS packages the default build.
default = ["ui"]
ui = ["dep:cypher-ui"]

[dependencies]
cypher-env.workspace = true
cypher-engine.workspace = true
cypher-rpc.workspace = true
cypher-proto.workspace = true
cypher-ui = { workspace = true, optional = true }
cypher-update.workspace = true
tokio.workspace = true
clap.workspace = true
mimalloc.workspace = true
anyhow.workspace = true
libc.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
