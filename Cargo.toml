[workspace]
resolver = "2"
members = [
    "crates/env",
    "crates/proto",
    "crates/doc",
    "crates/net",
    "crates/sync",
    "crates/harness",
    "crates/engine",
    "crates/rpc",
    "crates/update",
    "crates/ui",
    "crates/syntax",
    "apps/cypher",
]

[workspace.package]
version = "0.3.45"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
cypher-env = { path = "crates/env" }
cypher-proto = { path = "crates/proto" }
cypher-doc = { path = "crates/doc" }
cypher-net = { path = "crates/net" }
cypher-sync = { path = "crates/sync" }
cypher-harness = { path = "crates/harness" }
cypher-engine = { path = "crates/engine" }
cypher-rpc = { path = "crates/rpc" }
cypher-update = { path = "crates/update" }
cypher-ui = { path = "crates/ui" }
cypher-syntax = { path = "crates/syntax" }

# CRDT
loro = "1.13"

# gpui — the wingleeio/zed fork: upstream f14fea9 plus the fork's commits on
# `comet/edge-fade-horizontal` (wrap-rule fixes, EdgeFade, BackdropBlur, GPU
# memory bounds, ImageSource::evict, transparent-window alpha). Rebase the
# branch when bumping the upstream rev.
gpui = { git = "https://github.com/wingleeio/zed", rev = "5d1f83d9f27a19bec1fb241dc33b42238af9cf8d" }
gpui_platform = { git = "https://github.com/wingleeio/zed", rev = "5d1f83d9f27a19bec1fb241dc33b42238af9cf8d", features = [
    "wayland",
    "x11",
    "font-kit",
    "runtime_shaders",
] }
gpui_tokio = { git = "https://github.com/wingleeio/zed", rev = "5d1f83d9f27a19bec1fb241dc33b42238af9cf8d" }
# Real HTTP for gpui's `img()` element (remote avatar URLs); gpui itself
# defaults to a null client, so images would always fall back.
reqwest_client = { git = "https://github.com/wingleeio/zed", rev = "5d1f83d9f27a19bec1fb241dc33b42238af9cf8d" }

# diffs
similar = "2"

# async / net
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
libc = "0.2"
gethostname = "1"
# Both root stores, unioned — see the reqwest note below. tungstenite's default
# connector loads the native certs first and then extends with webpki
# (tokio-tungstenite/src/tls.rs); keeping webpki on also compiles out its
# "no native root CA certificates found" hard error, which would otherwise fail
# every wss:// dial on an image with an empty system trust store.
tokio-tungstenite = { version = "0.24", features = [
    "rustls-tls-native-roots",
    "rustls-tls-webpki-roots",
] }
futures = "0.3"
async-trait = "0.1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# storage
rusqlite = { version = "0.32", features = ["bundled"] }

# misc
# Global allocator for the binaries: returns freed pages to the OS. System
# malloc (macOS libmalloc especially) retains the churn high-water mark as
# permanent RSS - measured as the top residency cause.
mimalloc = "0.1"
anyhow = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
base64 = "0.22"
url = "2"
getrandom = "0.4"
# Already in the graph via gpui (same version/features): re-encodes pasted
# TIFF/BMP images as PNG before upload.
image = { version = "0.25", default-features = false, features = ["png", "tiff", "bmp"] }
objc = "0.2"
notify = "7"
portable-pty = "0.8"
alacritty_terminal = "0.26"
pulldown-cmark = "0.12"
unicode-segmentation = "1"
# `rustls-tls` alone is webpki-roots only: the bundled CA list never consults the
# OS trust store, so a corporate TLS-inspecting proxy's CA — installed in the
# system store, which is the only place an admin can put it — is not trusted and
# every request fails behind such a network. Adding native-roots unions the two
# stores into one root set (async_impl/client.rs fills `root_cert_store` from
# both), which is the browser-equivalent posture: enterprise CAs work, and a
# machine whose system store is empty or unreadable still falls back to the
# bundled roots instead of losing TLS outright.
#
# Every client here takes the default root store, so the feature is the whole
# fix — no builder call site needs to change. Note this resolves to
# `__rustls-ring`, not aws-lc, matching the ring provider both binaries install.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "rustls-tls-native-roots",
    "json",
    "stream",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ignore = "0.4"
# fuzzy path ranking for file mentions (match_paths mode is tuned for source trees)
nucleo-matcher = "0.3"
# Offline language detection for translation gating, built with exactly the two
# languages the translation settings offer.
#
# Each language embeds its model into the binary through `include_dir!`, and the
# European Latin models are enormous next to the rest: all ten languages the
# first draft carried cost 31MB (17.7MB compressed, against a 27.6MB macOS
# DMG), of which Chinese and English are 4.4MB. The candidate set is also what
# makes an answer trustworthy — a detector that has never heard of Turkish
# cannot report a mixed zh/en message as Turkish, which is what whatlang did.
# Adding a language here means adding it to LANGUAGE_OPTIONS (the settings
# card) and LANGUAGE_ALIASES (the extension) in the same change.
lingua = { version = "1.8", default-features = false, features = [
    "chinese",
    "english",
] }

[profile.release]
# Distribution profile (scripts/package-linux.sh): thin LTO buys most of fat
# LTO's size/speed win at a fraction of the link time; strip debug symbols.
lto = "thin"
strip = "symbols"

[profile.dev]
# gpui is slow unoptimized; match zed's approach for deps
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
