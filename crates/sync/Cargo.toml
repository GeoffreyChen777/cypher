[package]
name = "cypher-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cypher-doc.workspace = true
cypher-net.workspace = true
loro.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[features]
# In-process registry server speaking the DO's JSON WS protocol — test
# infrastructure for this crate's tests and cypher-engine's integration tests.
mock-server = []

# These two drive the in-process registry server, which only exists behind
# `mock-server`. Declaring it keeps `--all-targets` (clippy, cargo test)
# working without the feature instead of failing to resolve the import, and
# names what the target actually needs.
[[test]]
name = "registry_client"
required-features = ["mock-server"]

[[test]]
name = "registry_transport"
required-features = ["mock-server"]

[dev-dependencies]
chrono.workspace = true
# registry_edge reads CYPHER_EDGE_WS.
cypher-env.workspace = true
# chat2_live example only (live checkpoint fetch against a deployed worker).
reqwest.workspace = true
cypher-proto.workspace = true
tempfile.workspace = true
# `start_paused` virtual-clock tests (sync-stall regressions).
tokio = { workspace = true, features = ["test-util"] }
